# AutoGrade CS - production stack
#
#   cp .env.example .env      # then fill it in
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Only the proxy publishes a port. The API, the worker, the frontend and
# PostgreSQL talk to each other on an internal network and are not reachable
# from outside the host - so the API cannot be called around the proxy (which
# would bypass rate limiting and TLS), and the database is not exposed at all.
#
# Six services, which is the minimum this design needs:
#   caddy     TLS termination, security headers, body limit, public entrypoint
#   frontend  Streamlit UI
#   api       FastAPI - serves requests, never grades
#   worker    grades; the only process that talks to the model provider
#   db        PostgreSQL
#   backup    periodic pg_dump with retention

name: autograde

services:
  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      PUBLIC_HOSTNAME: ${PUBLIC_HOSTNAME:?set PUBLIC_HOSTNAME in .env}
      # `:-` covers unset *and* empty. Only used for local runs -
      # with a real hostname set ACME_EMAIL to a real address.
      ACME_EMAIL: ${ACME_EMAIL:-noreply@localhost}
      MAX_REQUEST_BODY_MB: ${MAX_REQUEST_BODY_MB:-300}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data          # certificates - losing these means re-issuing
      - caddy_config:/config
    depends_on:
      - frontend
      - api
    networks: [edge, app]

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    restart: unless-stopped
    environment:
      AUTOGRADE_API_BASE: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    networks: [app]
    expose: ["8501"]

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    # Named so the worker can reuse this exact image rather than building
    # the same Dockerfile a second time. Two services building one
    # Dockerfile in parallel raced on the apt layer and failed the build,
    # and sharing the image also guarantees both run identical code.
    image: autograde-backend:latest
    restart: unless-stopped
    env_file: .env
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+psycopg2://autograde:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/autograde
      UPLOAD_DIR: /app/uploads
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    networks: [app, data]
    expose: ["8000"]

  worker:
    # Same image as the API, different command. Built by the `api` service.
    image: autograde-backend:latest
    restart: unless-stopped
    # Migrations are the API's job; the worker only waits for them and runs.
    entrypoint: ["python", "-m", "backend.worker"]
    # The image's healthcheck curls the API's own port, which a worker does
    # not listen on - inherited unchanged it reports "unhealthy" forever and
    # buries real alerts. A worker has no endpoint to probe, so liveness is
    # covered by `restart: unless-stopped` plus the stale-job reaper: if this
    # process dies mid-run, another worker requeues the job within a minute.
    healthcheck:
      disable: true
    env_file: .env
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+psycopg2://autograde:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/autograde
      UPLOAD_DIR: /app/uploads
    volumes:
      # The worker reads the submission files it grades, so it needs the
      # same volume as the API - not a copy.
      - uploads:/app/uploads
    depends_on:
      api:
        condition: service_healthy
    networks: [app, data]
    # Scale with `--scale worker=N`; claiming is transactional, so several
    # workers share the queue safely.

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: autograde
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: autograde
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autograde -d autograde"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    # No `ports:` on purpose. To inspect it, tunnel in:
    #   docker compose -f docker-compose.prod.yml exec db psql -U autograde
    networks: [data]

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
    volumes:
      - ./docker/backup.sh:/usr/local/bin/backup.sh:ro
      - backups:/backups
    entrypoint: ["/bin/sh", "/usr/local/bin/backup.sh"]
    depends_on:
      db:
        condition: service_healthy
    networks: [data]

networks:
  # Three networks, each with one job.
  #
  #   edge  only caddy, which is the only service that publishes ports.
  #   app   caddy/frontend/api/worker. A normal bridge network: nothing on
  #         it is reachable from outside (no published ports), but outbound
  #         traffic works - which the worker needs, because grading calls
  #         the model provider over the internet. Marking this `internal`
  #         severed that egress and every submission failed with
  #         "could not reach the openai server".
  #   data  api/worker/backup/db, and `internal: true` here on purpose:
  #         PostgreSQL has no reason to reach the internet, so it cannot.
  edge:
  app:
  data:
    internal: true

volumes:
  pgdata:       # the gradebook
  uploads:      # student submissions - not in the database
  backups:      # pg_dump output; copy this off the host (see DEPLOYMENT.md)
  caddy_data:
  caddy_config:
