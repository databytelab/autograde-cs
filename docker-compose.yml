# AutoGrade CS - development stack
#
#   docker compose up --build
#
#   backend   http://localhost:8000/docs
#   frontend  http://localhost:8501
#
# Copy .env.example to .env and fill in your API key and SECRET_KEY before
# starting. The default profile runs SQLite; `--profile postgres` swaps in
# a real database.
#
# For a real installation use docker-compose.prod.yml - see INSTALL.md.

services:
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      # Overridden by the postgres profile below.
      DATABASE_URL: ${DATABASE_URL:-sqlite:///./data/autograde.db}
      UPLOAD_DIR: /app/uploads
    volumes:
      # Student files and the SQLite database must outlive the container.
      - uploads:/app/uploads
      - data:/app/data
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    # Grading runs here, not in the web request. Without this service,
    # jobs are accepted and then sit at "queued" forever.
    command: ["python", "-m", "backend.worker"]
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite:///./data/autograde.db}
      UPLOAD_DIR: /app/uploads
    volumes:
      # The same files and the same database the backend writes.
      - uploads:/app/uploads
      - data:/app/data
    depends_on:
      backend:
        condition: service_healthy
    # It serves no port, so the backend's HTTP healthcheck cannot apply.
    healthcheck:
      disable: true
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    ports:
      - "8501:8501"
    environment:
      # Inside the compose network the backend answers to its service name.
      AUTOGRADE_API_BASE: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    profiles: ["postgres"]
    environment:
      POSTGRES_USER: autograde
      # No default: a database that silently accepts a published password is
      # worse than one that refuses to start. Set POSTGRES_PASSWORD in .env.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: autograde
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autograde"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  uploads:
  data:
  pgdata:
